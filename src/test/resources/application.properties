spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:test}
spring.datasource.username=${DB_USER:icares}
spring.datasource.password=${DB_PASSWORD:icares}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-init-sql=SET lock_timeout TO '5s'; SET statement_timeout TO '15s'
